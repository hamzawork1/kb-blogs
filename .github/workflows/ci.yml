# CI / CD — single workflow, parallel-DAG topology.
#
# Shift-left quality gates (Lint, Typecheck) run in parallel and must pass
# before Build. Build uploads the dist/ artifact; Deploy downloads it and
# ships to Cloudflare Workers via wrangler-action (Wrangler 4).
#
# Required repository secrets (consumed by the deploy job):
#   CLOUDFLARE_API_TOKEN   - scope: Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID  - found in the Cloudflare dashboard sidebar
#
# Path-ignore: docs / metadata / IDE / Claude-local files do not affect the
# built site, so commits touching only those skip CI entirely. Keep this list
# in sync with what truly has zero impact on dist/.

name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "scripts/generate-covers.ps1"
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "scripts/generate-covers.ps1"
  workflow_dispatch:

# Least-privilege default at the workflow root. Individual jobs escalate as
# needed (deploy job adds deployments: write).
permissions:
  contents: read

# Prevent overlapping runs on the same ref. PR runs cancel on new pushes;
# main/staging deploys queue (don't drop a deploy mid-flight).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        # Audit mode: logs outbound network calls without blocking. Defence-
        # in-depth against compromised dependencies exfiltrating data.
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node-pnpm
      - name: Run Biome
        run: pnpm lint

  typecheck:
    name: Typecheck (astro check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node-pnpm
      - name: Run astro check
        run: pnpm check
        env:
          GISCUS_REPO: ${{ secrets.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ secrets.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
          GISCUS_MAPPING: ${{ secrets.GISCUS_MAPPING }}
          GISCUS_STRICT: ${{ secrets.GISCUS_STRICT }}
          GISCUS_REACTIONS_ENABLED: ${{ secrets.GISCUS_REACTIONS_ENABLED }}
          GISCUS_EMIT_METADATA: ${{ secrets.GISCUS_EMIT_METADATA }}
          GISCUS_LANG: ${{ secrets.GISCUS_LANG }}

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep this list in sync with the type-enum in commitlint.config.mjs -
          # otherwise a commit message type that's valid per-commit (e.g. "post"
          # for a new blog post) still fails the aggregate PR title check.
          types: |
            feat
            fix
            docs
            ci
            chore
            refactor
            perf
            style
            test
            post
            revert
            build

  commitlint:
    name: Commitlint (per-commit message)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run commitlint on all PR commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ./commitlint.config.mjs

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # required by attest-build-provenance to sign with OIDC
      attestations: write # required by attest-build-provenance to write the attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node-pnpm
      - name: Build (Astro + Pagefind index)
        run: pnpm build
        env:
          GISCUS_REPO: ${{ secrets.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ secrets.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
          GISCUS_MAPPING: ${{ secrets.GISCUS_MAPPING }}
          GISCUS_STRICT: ${{ secrets.GISCUS_STRICT }}
          GISCUS_REACTIONS_ENABLED: ${{ secrets.GISCUS_REACTIONS_ENABLED }}
          GISCUS_EMIT_METADATA: ${{ secrets.GISCUS_EMIT_METADATA }}
          GISCUS_LANG: ${{ secrets.GISCUS_LANG }}
      - name: Verify Pagefind index exists
        run: test -d dist/pagefind && echo "OK" || (echo "Pagefind index missing"; exit 1)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7
          if-no-files-found: error
      # SLSA Level 3 build provenance. Cryptographically signs the dist
      # artifact via the GitHub OIDC token; verifiable via
      # `gh attestation verify --owner hamzawork1 <file>`. Push-only because
      # PRs from forks cannot mint OIDC tokens.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/**/*

  lighthouse:
    name: Lighthouse CI (perf + a11y budgets)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # post Lighthouse score comment on PRs
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        # Needed for `.lighthouserc.json` and so the action can detect repo
        # context for the PR comment.
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      # Budgets ship as `warn` initially - first runs establish a baseline,
      # then we'll flip to `error` once the numbers are stable. Reports
      # upload to Lighthouse's free `temporary-public-storage` (7-day
      # retention) and the action auto-comments the PR with scores.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  link-check-offline:
    name: Link audit (offline, internal refs)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        # Needed so the action can find lychee.toml at the repo root.
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      # Offline mode: catches dead RELATIVE links inside the built site
      # without hitting the network. Fast (~10s) and deterministic - exactly
      # what we want as a PR-blocking gate. Live external links are checked
      # by `link-check-live` after staging deploy, on a different cadence.
      # --root-dir requires an absolute path. ${{ github.workspace }} resolves
      # to the runner workspace root; the previous --base ./dist was rejected
      # by Lychee v0.23 ("Base must be a URL or absolute local path").
      - name: Run Lychee (offline)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --offline --root-dir ${{ github.workspace }}/dist --no-progress ./dist
          fail: true

  deploy:
    name: Deploy to Cloudflare Workers (${{ github.ref_name }})
    needs: [build, lighthouse]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.cf.outputs.deployment-url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      # wranglerVersion: 4 is required. The default Wrangler 3.x installed
      # by this action does NOT support the [assets] directive used by
      # static-only Workers - it expects a `main` JS entry-point and fails
      # to parse `[env.<name>]` blocks that lack one.
      #
      # --name forces the Worker name unambiguously. The first staging
      # deploy created a Worker named `kb-blogs-staging` instead of the
      # `mhamza-space-staging` declared in `[env.staging].name` - likely
      # because Cloudflare resolved env-block name against pre-existing
      # project context. The CLI flag overrides everything.
      - name: Deploy via Wrangler
        id: cf
        # Third-party action SHA-pinned for supply-chain hardening.
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --env ${{ github.ref_name == 'main' && 'production' || 'staging' }} --name ${{ github.ref_name == 'main' && 'mhamza-space-prod' || 'mhamza-space-staging' }}

  smoke:
    name: Smoke test (synthetic GET)
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup-node-pnpm
      # Hit the just-deployed URL and assert the page is real (status 200 +
      # content markers). Catches "deploy succeeded but site is broken".
      # URL is environment-aware: prod gets blog.mhamza.space, staging gets
      # the staging subdomain.
      - name: Run smoke test
        run: |
          node scripts/smoke.mjs "${{ github.ref_name == 'main' && 'https://blog.mhamza.space' || 'https://staging.mhamza.space' }}"

  link-check-live:
    name: Link audit (live, external)
    # Only after a staging deploy. Production deploys are deliberate and
    # we don't want a flaky external-link result to imply a bad prod ship.
    # Weekly cron in link-check-cron.yml catches external rot independently.
    needs: deploy
    if: github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4
      # Lychee against the sitemap URL extracted Total=0 in earlier runs
      # (XML response not parsed as link source). Fetch the sitemap here,
      # extract the <loc> URLs, remap them from production to staging, and
      # hand them to Lychee explicitly. Same end result, deterministic.
      - name: Build staging URL list from sitemap
        id: urls
        run: |
          set -e
          urls=$(curl -sS https://staging.mhamza.space/sitemap-0.xml \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -E 's|</?loc>||g' \
            | sed 's|https://blog\.mhamza\.space|https://staging.mhamza.space|g' \
            | tr '\n' ' ')
          if [ -z "$urls" ]; then
            echo "Failed to extract URLs from sitemap"
            exit 1
          fi
          echo "Discovered URLs:"
          echo "$urls" | tr ' ' '\n'
          echo "urls=$urls" >> "$GITHUB_OUTPUT"

      # Lychee fetches each URL, parses the HTML, and checks every outbound
      # link. Catches LinkedIn going down, blog reference URLs that 404'd,
      # external GitHub repos archived, etc. Failure here does NOT roll
      # back the deploy - it surfaces as a failed workflow on the commit.
      # --remap: pages have canonical / og:url tags pointing at the production
      # domain (Astro builds them from astro.config.ts's site field). Without
      # remap, Lychee hits https://blog.mhamza.space/... and gets HTTP 522
      # because production isn't deployed. Remap rewrites those at check time.
      - name: Run Lychee (live, page-by-page)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --no-progress --verbose --remap "https://blog.mhamza.space https://staging.mhamza.space" ${{ steps.urls.outputs.urls }}
          fail: true
