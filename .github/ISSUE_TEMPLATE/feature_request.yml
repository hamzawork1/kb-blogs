name: Feature request
description: Suggest a new feature, content idea, or tooling improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving?
      description: Why is the current state not enough? Skip if this is purely additive.
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would the site / tooling do after this lands?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they were ruled out — optional.
    validations:
      required: false
