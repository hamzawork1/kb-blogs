# Cloudflare Worker — static site delivery for mhamza.space.
#
# This Worker has no code of its own; it serves the contents of dist/
# (the Astro build output) as static assets at the edge.
#
# Two named environments:
#   - production -> Worker name "mhamza-space"          (mapped to mhamza.space)
#   - staging    -> Worker name "mhamza-space-staging"  (mapped to staging.mhamza.space later)
#
# The GitHub Actions workflow picks the environment based on the pushed branch:
#   main    -> --env production
#   staging -> --env staging
#
# Reference: https://developers.cloudflare.com/workers/static-assets/

name = "mhamza-space"
compatibility_date = "2025-05-25"

[assets]
directory = "./dist"
# When a request doesn't match a built asset, fall back to the prebuilt 404 page
# from src/pages/404.astro. (single-page-application would route everything to
# index.html — not what we want for a multi-page static site.)
not_found_handling = "404-page"
# No HTML extension stripping; Astro already emits clean URLs (/blog/<slug>/index.html).
html_handling = "auto-trailing-slash"

# ---------------------------------------------------------------------------
# Production environment — pushed on commits to `main`.
# ---------------------------------------------------------------------------
[env.production]
name = "mhamza-space"
# Keep the .workers.dev default URL disabled. Without this, every deploy
# re-enables it (Wrangler default = true), which leaks an off-domain access
# path. mhamza.space is the only intended entrypoint.
workers_dev = false

[env.production.assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# ---------------------------------------------------------------------------
# Staging environment — pushed on commits to `staging`.
# Separate Worker so prod and staging can be rolled back independently.
# ---------------------------------------------------------------------------
[env.staging]
name = "mhamza-space-staging"
# Same reasoning as production - only staging.mhamza.space should serve the
# site. The .workers.dev URL was disabled manually after the first deploy
# but every subsequent `wrangler deploy` re-enabled it; pinning here makes
# the disable persistent.
workers_dev = false

[env.staging.assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
